# Local development. Start PostgreSQL with `docker compose up -d`.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev
  jpa:
    show-sql: false

tranix:
  # Dev testing uses the free map services by default (OSRM routes, OpenStreetMap Nominatim search).
  integrations:
    maps: ${MAPS_PROVIDER:osrm}
    geocoding: ${GEOCODING_PROVIDER:nominatim}
  admin:
    mobiles: 9000000006
  jwt:
    # Dev-only value; never used outside the dev profile.
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
  files:
    signing-secret: ${FILES_SIGNING_SECRET:dev-only-files-secret-0123456789abcdef}
  dev:
    # Fixed OTP in dev only (B-102). Set DEV_OTP to empty to get real random codes by SMS (Twilio).
    # Leave 123456 so testers whose numbers are not verified on a Twilio trial can still sign in.
    otp: ${DEV_OTP:123456}

logging:
  level:
    com.nothing.tranix: DEBUG
