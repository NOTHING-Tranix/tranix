# Automated tests. The database comes from Testcontainers (@ServiceConnection).
spring:
  datasource:
    hikari:
      maximum-pool-size: 30
  flyway:
    locations: classpath:db/migration

tranix:
  async:
    after-commit: false   # B-1611: listeners run right away in tests (BurstIT turns async on)
  jwt:
    secret: test-only-jwt-secret-0123456789abcdef0123
  files:
    storage-dir: ${java.io.tmpdir}/tranix-test-files
    signing-secret: test-only-files-secret-0123456789abcdef
  jobs:
    enabled: false
  rate-limit:
    auth-per-minute: 100000
    public-per-minute: 100000
