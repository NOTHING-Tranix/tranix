name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "docs/api-contract.md", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docs/api-contract.md", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests + Testcontainers integration tests (Docker is available on ubuntu runners)
      - run: ./mvnw -B verify

  image:
    # B-1404: the production image must keep building
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tranix-backend:ci backend
